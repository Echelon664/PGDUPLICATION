name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  summaries-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check summaries against their PDFs
        run: python summaries.py check
      - name: Unit tests
        run: python -m unittest test_summaries test_county_sync test_pdf_dates
      - name: Build the page
        run: python generate_preview.py
